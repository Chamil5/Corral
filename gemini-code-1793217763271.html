<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cattle Corral & Handling Facility Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .btn-action {
            transition: all 0.2s ease-in-out;
        }
        .btn-action:hover {
            transform: translateY(-1px);
        }
        .btn-action:active {
            transform: translateY(1px);
        }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="absolute top-4 left-4 z-10 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
        <div class="glass-panel p-4 rounded-xl pointer-events-auto">
            <div class="flex items-center justify-between mb-2">
                <h1 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                    3D Corral Facility
                </h1>
                <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">1:1 Scale (Feet)</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed mb-3">
                110 ft × 100 ft cattle handling facility. Click any gate to open/close individually.
            </p>
            
            <div class="grid grid-cols-2 gap-2 text-xs mb-2">
                <button id="btn-orbit-mode" class="btn-action bg-amber-600 hover:bg-amber-500 text-white py-2 px-3 rounded-lg font-medium shadow flex items-center justify-center gap-1.5">
                    Orbit / Overhead
                </button>
                <button id="btn-walk-mode" class="btn-action bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-lg font-medium flex items-center justify-center gap-1.5">
                    First-Person Walk
                </button>
            </div>

            <button id="btn-toggle-all-gates" class="w-full btn-action bg-emerald-600 hover:bg-emerald-500 text-white py-2 px-3 rounded-lg font-medium text-xs shadow flex items-center justify-center gap-1.5">
                Toggle All Gates Open / Closed
            </button>
        </div>

        <div id="walk-instructions" class="glass-panel p-3 rounded-xl pointer-events-auto hidden text-xs text-slate-300">
            <p class="font-semibold text-amber-300 mb-1 flex items-center justify-between">
                <span>First-Person Controls</span>
            </p>
            <ul class="space-y-1 text-[11px] text-slate-300">
                <li><strong class="text-white">W, A, S, D</strong> : Walk Fast</li>
                <li><strong class="text-white">SHIFT</strong> : Sprint / Run Extra Fast</li>
                <li><strong class="text-white">Left Click</strong> : Click Crosshair on Gate to Toggle</li>
                <li><strong class="text-white">ESC</strong> : Release Mouse Lock</li>
            </ul>
        </div>
    </div>

    <div class="absolute bottom-4 left-4 z-10 flex gap-2 pointer-events-auto">
        <button id="view-top" class="glass-panel hover:bg-slate-700/80 text-xs px-3 py-2 rounded-lg font-medium border border-slate-600 text-slate-200 btn-action">
            Top-Down 2D
        </button>
        <button id="view-iso" class="glass-panel hover:bg-slate-700/80 text-xs px-3 py-2 rounded-lg font-medium border border-slate-600 text-slate-200 btn-action">
            3D Isometric
        </button>
        <button id="view-chute" class="glass-panel hover:bg-slate-700/80 text-xs px-3 py-2 rounded-lg font-medium border border-slate-600 text-slate-200 btn-action">
            Chute / Sweep
        </button>
        <button id="view-loadout" class="glass-panel hover:bg-slate-700/80 text-xs px-3 py-2 rounded-lg font-medium border border-slate-600 text-slate-200 btn-action">
            Loadout Exit
        </button>
    </div>

    <div id="crosshair" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none hidden z-20">
        <div class="w-3 h-3 rounded-full border border-amber-400/80 bg-amber-400/30"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let currentMode = 'orbit';
        let pipeMaterial, gateMaterial;
        const gateObjects = [];
        let allGatesOpen = false;

        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;

        const walkControls = new PointerLockControls(camera, document.body);

        function setIsometricView() {
            camera.position.set(55, 90, 150);
            orbitControls.target.set(55, 0, 45);
            orbitControls.update();
        }
        setIsometricView();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        sunLight.position.set(120, 150, 90);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        pipeMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3539, metalness: 0.7, roughness: 0.35 });
        gateMaterial = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.85, roughness: 0.25 });

        const groundMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.MeshStandardMaterial({ color: 0x857157, roughness: 0.9 })
        );
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const groundGrid = new THREE.GridHelper(300, 300, 0xd97706, 0x475569);
        groundGrid.position.set(75, 0.02, 50);
        scene.add(groundGrid);

        const fenceGroup = new THREE.Group();
        scene.add(fenceGroup);

        function createFencePanel(x1, z1, x2, z2, height = 5.5, rails = 5) {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const length = Math.hypot(dx, dz);
            if (length < 0.05) return;

            const angle = Math.atan2(dz, dx);
            const group = new THREE.Group();

            const railRadius = 0.12;
            const railGeo = new THREE.CylinderGeometry(railRadius, railRadius, length, 8);

            for (let r = 0; r < rails; r++) {
                const rail = new THREE.Mesh(railGeo, pipeMaterial);
                rail.rotation.z = Math.PI / 2;
                rail.position.set(0, (height / (rails + 1)) * (r + 1), 0);
                rail.castShadow = true;
                group.add(rail);
            }

            const postCount = Math.max(2, Math.ceil(length / 8) + 1);
            const postGeo = new THREE.CylinderGeometry(0.2, 0.2, height + 0.5, 12);

            for (let p = 0; p < postCount; p++) {
                const post = new THREE.Mesh(postGeo, pipeMaterial);
                const posOnLine = -length / 2 + (p / (postCount - 1)) * length;
                post.position.set(posOnLine, (height + 0.5) / 2, 0);
                post.castShadow = true;
                group.add(post);
            }

            group.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
            group.rotation.y = -angle;
            fenceGroup.add(group);
        }

        function createHingedGate(x1, z1, x2, z2, label = "10ft Gate", swingDirection = -1) {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const length = Math.hypot(dx, dz);
            const baseAngle = Math.atan2(dz, dx);

            const pivotGroup = new THREE.Group();
            pivotGroup.position.set(x1, 0, z1);
            pivotGroup.rotation.y = -baseAngle;

            const postGeo = new THREE.CylinderGeometry(0.3, 0.3, 6.5, 16);
            const hingePost = new THREE.Mesh(postGeo, new THREE.MeshStandardMaterial({ color: 0x334155 }));
            hingePost.position.set(0, 3.25, 0);
            hingePost.castShadow = true;
            pivotGroup.add(hingePost);

            const leafGroup = new THREE.Group();
            const frameRadius = 0.16;
            const topBarGeo = new THREE.CylinderGeometry(frameRadius, frameRadius, length - 0.4);
            
            const topBar = new THREE.Mesh(topBarGeo, gateMaterial);
            topBar.rotation.z = Math.PI / 2;
            topBar.position.set(length / 2, 5.2, 0);
            leafGroup.add(topBar);

            const botBar = topBar.clone();
            botBar.position.y = 1.0;
            leafGroup.add(botBar);

            for (let r = 1; r <= 3; r++) {
                const rail = new THREE.Mesh(topBarGeo, gateMaterial);
                rail.rotation.z = Math.PI / 2;
                rail.position.set(length / 2, 1.0 + (4.2 / 4) * r, 0);
                leafGroup.add(rail);
            }

            pivotGroup.add(leafGroup);

            const gateObj = {
                pivotGroup,
                leafGroup,
                isOpen: false,
                currentAngle: 0,
                targetAngle: 0,
                baseAngle,
                swingDirection,
                label
            };

            pivotGroup.userData.gateObj = gateObj;
            leafGroup.userData.gateObj = gateObj;

            gateObjects.push(gateObj);
            fenceGroup.add(pivotGroup);
        }

        function buildCorralFacility() {
            // 1. BOUNDARY WALLS
            createFencePanel(0, 0, 110, 0);     
            createFencePanel(0, 0, 0, 100);     
            createFencePanel(0, 100, 90, 100);  
            createFencePanel(110, 0, 110, 30);  
            
            // East vertical boundary gate
            createHingedGate(110, 30, 110, 40, "East Vertical Gate", 1);
            
            createFencePanel(110, 40, 110, 50);

            // 1b. EAST EXPANSION PEN
            createFencePanel(110, 0, 150, 0);   
            createFencePanel(150, 0, 150, 30);  
            createHingedGate(150, 30, 150, 40, "East Pen Access Gate", 1); 
            createFencePanel(150, 40, 110, 40); 

            // 1c. FAR EAST EXTENSION PEN
            // North fence line with outer gate
            createFencePanel(150, 0, 160, 0);   
            createHingedGate(160, 0, 180, 0, "Far East North Outer Gate", -1);
            createFencePanel(180, 0, 230, 0);   
            
            // EAST FENCE LINE (x=230) WITH BOTH GATES RETAINED:
            createHingedGate(230, 0, 230, 25, "East Line North Gate", -1);
            createFencePanel(230, 25, 230, 45);                             
            createHingedGate(230, 45, 230, 70, "East Line South Gate", 1);   

            // Solid lower angled fence line (gate removed from blue box position)
            createFencePanel(190, 60, 230, 70);

            // Inner diagonal divider wall with gate moved to RED box position
            createFencePanel(150, 40, 160, 45);
            createHingedGate(160, 45, 175, 52.5, "Diagonal Pen Gate", 1);
            createFencePanel(175, 52.5, 190, 60);

            // 2. TOP PENS
            createFencePanel(0, 30, 35, 30);
            createHingedGate(35, 30, 45, 30, "Pen 1 Gate", -1);

            createFencePanel(45, 30, 67, 30);
            createHingedGate(67, 30, 77, 30, "Pen 2 Gate", -1);

            createFencePanel(77, 30, 100, 30);
            createHingedGate(100, 30, 110, 30, "Pen East Outer Gate", 1);

            createFencePanel(45, 0, 45, 20);
            createHingedGate(45, 30, 45, 20, "Pen 1/2 Cross Gate", 1);

            createFencePanel(77, 0, 77, 20);
            createHingedGate(77, 30, 77, 20, "Pen 2/3 Cross Gate", 1);

            // 3. TOP & LEFT ALLEYWAYS
            createFencePanel(10, 40, 35, 40);
            createHingedGate(35, 40, 45, 40, "Central Pen Top Left Gate", 1);
            createFencePanel(45, 40, 67, 40);
            createHingedGate(67, 40, 77, 40, "Central Pen Top Right Gate", 1);
            createFencePanel(77, 40, 100, 40);

            createHingedGate(100, 40, 110, 40, "Upper Alley East Gate", -1);
            
            createFencePanel(10, 40, 10, 70);
            createHingedGate(10, 70, 10, 80, "Working Alley Left Entrance Gate", 1);

            createHingedGate(0, 40, 10, 40, "Top Left Alley Gate", 1);
            createHingedGate(0, 70, 10, 70, "Mid Left Alley Gate", 1);

            // 3b. CENTRAL HOLDING PENS
            createFencePanel(45, 40, 45, 70);
            createFencePanel(77, 40, 77, 70);

            createFencePanel(10, 70, 35, 70);
            createHingedGate(35, 70, 45, 70, "Central Pen Bottom Left Gate", -1);
            createHingedGate(45, 70, 55, 70, "Central Pen Bottom Center Gate", -1);
            createFencePanel(55, 70, 77, 70);

            // 4. WORKING HOLDING ALLEY
            createFencePanel(10, 90, 85, 90);

            createHingedGate(10, 90, 10, 100, "Working Alley Entrance Gate", 1);

            createHingedGate(35, 90, 25, 90, "Bottom Sorting Gate 1", 1);
            createHingedGate(60, 90, 50, 90, "Bottom Sorting Gate 2", 1);

            createHingedGate(85, 90, 100, 90, "Sweep Entrance Gate", -1);

            createFencePanel(10, 80, 10, 90);
            createFencePanel(10, 80, 85, 80);
            
            createHingedGate(85, 80, 95, 80, "Alley Sweep Entrance Gate", 1);

            createFencePanel(95, 80, 95, 50);

            createHingedGate(95, 50, 103.25, 50, "Chute Entry Gate", -1);

            // 5. OUTER SWEEP ARC & CHUTE
            const p0 = new THREE.Vector2(85, 90);
            const p1 = new THREE.Vector2(103.25, 90);
            const p2 = new THREE.Vector2(103.25, 65);
            const p3 = new THREE.Vector2(103.25, 50);

            let lastPoint = p0;
            for (let i = 1; i <= 16; i++) {
                const t = i / 16;
                const cx = Math.pow(1 - t, 3) * p0.x + 3 * Math.pow(1 - t, 2) * t * p1.x + 3 * (1 - t) * Math.pow(t, 2) * p2.x + Math.pow(t, 3) * p3.x;
                const cz = Math.pow(1 - t, 3) * p0.y + 3 * Math.pow(1 - t, 2) * t * p1.y + 3 * (1 - t) * Math.pow(t, 2) * p2.y + Math.pow(t, 3) * p3.y;
                createFencePanel(lastPoint.x, lastPoint.y, cx, cz);
                lastPoint = new THREE.Vector2(cx, cz);
            }

            const chuteExitX = 106.75;
            const chuteExitZ = 64;
            const extCenter = { x: 90, z: 64 };
            const extRadiusX = chuteExitX - extCenter.x;
            const extRadiusZ = 100 - extCenter.z;

            const extSegments = 12;
            for (let i = 0; i < extSegments; i++) {
                const t1 = i / extSegments;
                const t2 = (i + 1) / extSegments;
                const angle1 = (Math.PI / 2) * (1 - t1);
                const angle2 = (Math.PI / 2) * (1 - t2);
                const px1 = extCenter.x + extRadiusX * Math.cos(angle1);
                const pz1 = extCenter.z + extRadiusZ * Math.sin(angle1);
                const px2 = extCenter.x + extRadiusX * Math.cos(angle2);
                const pz2 = extCenter.z + extRadiusZ * Math.sin(angle2);
                createFencePanel(px1, pz1, px2, pz2);
            }

            const chuteMesh = new THREE.Mesh(
                new THREE.BoxGeometry(3.5, 6.5, 14),
                new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.4 })
            );
            chuteMesh.position.set(105, 3.25, 57);
            scene.add(chuteMesh);

            createHingedGate(0, 100, 10, 100, "Loadout Gate", 1);
        }

        buildCorralFacility();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function checkGateHover(ray) {
            const intersects = ray.intersectObjects(fenceGroup.children, true);
            if (intersects.length > 0) {
                for (let i = 0; i < intersects.length; i++) {
                    let obj = intersects[i].object;
                    while (obj && obj !== fenceGroup) {
                        if (obj.userData && obj.userData.gateObj) {
                            return true;
                        }
                        obj = obj.parent;
                    }
                }
            }
            return false;
        }

        function tryToggleGateFromRay(ray) {
            const intersects = ray.intersectObjects(fenceGroup.children, true);
            if (intersects.length > 0) {
                for (let i = 0; i < intersects.length; i++) {
                    let obj = intersects[i].object;
                    while (obj && obj !== fenceGroup) {
                        if (obj.userData && obj.userData.gateObj) {
                            const foundGate = obj.userData.gateObj;
                            foundGate.isOpen = !foundGate.isOpen;
                            foundGate.targetAngle = foundGate.isOpen ? (Math.PI / 2) * foundGate.swingDirection : 0;
                            return;
                        }
                        obj = obj.parent;
                    }
                }
            }
        }

        window.addEventListener('mousemove', (event) => {
            if (currentMode === 'orbit') {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                container.style.cursor = checkGateHover(raycaster) ? 'pointer' : 'default';
            }
        });

        window.addEventListener('click', (event) => {
            if (currentMode === 'orbit') {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                tryToggleGateFromRay(raycaster);
            } else if (currentMode === 'walk' && walkControls.isLocked) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                tryToggleGateFromRay(raycaster);
            }
        });

        const btnOrbit = document.getElementById('btn-orbit-mode');
        const btnWalk = document.getElementById('btn-walk-mode');
        const walkInst = document.getElementById('walk-instructions');
        const crosshair = document.getElementById('crosshair');

        function setCameraMode(mode) {
            currentMode = mode;
            if (mode === 'orbit') {
                walkControls.unlock();
                orbitControls.enabled = true;
                btnOrbit.className = "btn-action bg-amber-600 hover:bg-amber-500 text-white py-2 px-3 rounded-lg font-medium shadow flex items-center justify-center gap-1.5";
                btnWalk.className = "btn-action bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-lg font-medium flex items-center justify-center gap-1.5";
                walkInst.classList.add('hidden');
                crosshair.classList.add('hidden');
            } else {
                orbitControls.enabled = false;
                walkControls.lock();
                btnWalk.className = "btn-action bg-amber-600 hover:bg-amber-500 text-white py-2 px-3 rounded-lg font-medium shadow flex items-center justify-center gap-1.5";
                btnOrbit.className = "btn-action bg-slate-700 hover:bg-slate-600 text-white py-2 px-3 rounded-lg font-medium flex items-center justify-center gap-1.5";
                walkInst.classList.remove('hidden');
                crosshair.classList.remove('hidden');

                camera.position.set(16, 5.5, 95);
                camera.lookAt(80, 5.5, 95);
            }
        }

        btnOrbit.addEventListener('click', () => setCameraMode('orbit'));
        btnWalk.addEventListener('click', () => setCameraMode('walk'));

        walkControls.addEventListener('unlock', () => {
            if (currentMode === 'walk') {
                setCameraMode('orbit');
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (currentMode === 'walk' && !walkControls.isLocked) {
                walkControls.lock();
            }
        });

        document.getElementById('btn-toggle-all-gates').addEventListener('click', () => {
            allGatesOpen = !allGatesOpen;
            gateObjects.forEach(g => {
                g.isOpen = allGatesOpen;
                g.targetAngle = g.isOpen ? (Math.PI / 2) * g.swingDirection : 0;
            });
        });

        document.getElementById('view-top').addEventListener('click', () => {
            setCameraMode('orbit');
            camera.position.set(100, 180, 35.1);
            orbitControls.target.set(100, 0, 35);
            orbitControls.update();
        });

        document.getElementById('view-iso').addEventListener('click', () => {
            setCameraMode('orbit');
            setIsometricView();
        });

        document.getElementById('view-chute').addEventListener('click', () => {
            setCameraMode('orbit');
            camera.position.set(70, 20, 85);
            orbitControls.target.set(100, 4, 55);
            orbitControls.update();
        });

        document.getElementById('view-loadout').addEventListener('click', () => {
            setCameraMode('orbit');
            camera.position.set(16, 12, 125);
            orbitControls.target.set(16, 2, 95);
            orbitControls.update();
        });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        const moveVelocity = new THREE.Vector3();
        const moveDirection = new THREE.Vector3();

        const onKeyDown = (event) => {
            switch (event.code) {
                case 'KeyW': case 'ArrowUp': moveForward = true; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                case 'KeyD': case 'ArrowRight': moveRight = true; break;
                case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'KeyW': case 'ArrowUp': moveForward = false; break;
                case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                case 'KeyD': case 'ArrowRight': moveRight = false; break;
                case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            gateObjects.forEach(g => {
                if (Math.abs(g.currentAngle - g.targetAngle) > 0.01) {
                    g.currentAngle += (g.targetAngle - g.currentAngle) * delta * 5.0;
                    g.leafGroup.rotation.y = g.currentAngle;
                }
            });

            if (currentMode === 'walk' && walkControls.isLocked) {
                moveVelocity.x -= moveVelocity.x * 10.0 * delta;
                moveVelocity.z -= moveVelocity.z * 10.0 * delta;

                moveDirection.z = Number(moveForward) - Number(moveBackward);
                moveDirection.x = Number(moveRight) - Number(moveLeft);
                moveDirection.normalize();

                const speed = isSprinting ? 220.0 : 120.0;
                if (moveForward || moveBackward) moveVelocity.z -= moveDirection.z * speed * delta;
                if (moveLeft || moveRight) moveVelocity.x -= moveDirection.x * speed * delta;

                walkControls.moveRight(-moveVelocity.x * delta);
                walkControls.moveForward(-moveVelocity.z * delta);
                camera.position.y = 5.5;
            } else if (currentMode === 'orbit') {
                orbitControls.update();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
